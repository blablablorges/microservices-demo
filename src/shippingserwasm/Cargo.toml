[package]
name = "shippingserwasm"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "server"
path = "src/main.rs"

# WP-J1/H3: one dependency set for both targets. tonic 0.14 without `transport`
# (its `channel` half pulls a unconditional UnixStream and fails on wasip2);
# `server` + tokio-stream's TcpListenerStream lets the guest own its listener.
[dependencies]
tonic = { version = "0.14", default-features = false, features = ["server", "codegen", "router"] }
tonic-prost = "0.14"
prost = "0.14"
tonic-health = "0.14"
tokio = { version = "1.53", features = ["rt", "net", "macros", "io-util", "time", "sync"] }
tokio-stream = { version = "0.1", features = ["net"] }
anyhow = "1.0"
fastrand = "2.0"

[build-dependencies]
tonic-prost-build = "0.14"

# WP-H1: identical in every service crate of both SUTs, asserted by
# experimentes/orchestrator/deployment_symmetry.py. panic=abort because wasip2
# cannot unwind; native gets the same so neither side pays for landing pads the
# other lacks.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

# WP-J1: see src/lib/mio/HYRBID-PATCH.md
# WP-J2: see src/lib/tonic/HYRBID-PATCH.md and src/lib/socket2/HYRBID-PATCH.md
[patch.crates-io]
mio = { path = "../lib/mio" }
socket2 = { path = "../lib/socket2" }
tonic = { path = "../lib/tonic" }
