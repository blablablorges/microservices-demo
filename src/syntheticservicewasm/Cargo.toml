[package]
name = "syntheticservicewasm"
version = "0.1.0"
edition = "2021"
autobins = false

[[bin]]
name = "serve"
path = "bin/serve.rs"

[[bin]]
name = "server"
path = "bin/server.rs"

[lib]
crate-type = ["cdylib"]
name = "syntheticservicewasm"
path = "src/main.rs"

[dependencies]
tonic = { version = "0.13.1", features = ["codegen", "prost", "router"], default-features = false }
prost = "0.13.5"
wasi-grpc-server = { path = "../lib/wasi-grpc-server" }
wasi = "0.13.1"
wasi-hyperium = "0.3.0"
fastrand = "2.0"

# Dependencies ONLY for native binaries
[target.'cfg(not(target_family = "wasm"))'.dependencies]
anyhow = "1.0"
tokio = { version = "1.35", features = ["full"] }
wasmtime = { version = "27.0", features = ["component-model", "async"] }
wasmtime-wasi = "27.0"
wasmtime-wasi-http = "27.0"
hyper = { version = "1.0", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http = "1.0"
http-body-util = "0.1"
tonic = { version = "0.13.1", features = ["transport"], default-features = false }
tonic-health = "0.13.1"
redis = { version = "0.32", features = ["tokio-comp"] }

[build-dependencies]
tonic-build = { version = "0.13.1", features = ["prost"] }

# WP-H1: identical in every service crate of both SUTs, asserted by
# experimentes/orchestrator/deployment_symmetry.py. panic=abort because wasip2
# cannot unwind; native gets the same so neither side pays for landing pads the
# other lacks.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

# WP-J1: see src/lib/mio/HYRBID-PATCH.md
# WP-J2: see src/lib/tonic/HYRBID-PATCH.md and src/lib/socket2/HYRBID-PATCH.md
[patch.crates-io]
mio = { path = "../lib/mio" }
socket2 = { path = "../lib/socket2" }
tonic = { path = "../lib/tonic" }
