apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: syntheticservice
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: syntheticservice
  minReplicas: 1
  maxReplicas: 3
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 80
  # 60 s, not the 300 s default: a 300 s workload must show scale-down too (WP-K3).
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60